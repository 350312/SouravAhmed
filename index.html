    <!-- Custom Domain Fallback Script (if user points a custom domain) -->

      (function() {
        try {
          if (typeof window !== 'undefined' && window.location) {
            var origin = window.location.origin;
            var path = window.location.pathname;
            // Only dynamically replace if the host is different from the primary Vercel deployment
            if (origin && !origin.includes('portfolio-psi-dun-18.vercel.app') && !origin.includes('localhost') && !origin.includes('127.0.0.1')) {
              var fullUrl = origin + path;
              var canonical = document.querySelector('link[rel="canonical"]');
              if (canonical) canonical.setAttribute('href', fullUrl);
              var ogUrl = document.querySelector('meta[property="og:url"]');
              if (ogUrl) ogUrl.setAttribute('content', fullUrl);
              var ogImg = document.querySelector('meta[property="og:image"]');
              if (ogImg) ogImg.setAttribute('content', origin + '/og-image.jpg');
              var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
              if (ogImgSec) ogImgSec.setAttribute('content', origin + '/og-image.jpg');
              var twImg = document.querySelector('meta[name="twitter:image"]');
              if (twImg) twImg.setAttribute('content', origin + '/og-image.jpg');
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- Canonical URL resolution -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location) {
            var origin = window.location.origin;
            var path = window.location.pathname;
            var fullUrl = origin + path;

            // Set or update canonical link
            var canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
              canonicalLink = document.createElement('link');
              canonicalLink.setAttribute('rel', 'canonical');
              document.head.appendChild(canonicalLink);
            }
            canonicalLink.setAttribute('href', fullUrl);

            // Set og:url meta
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (!ogUrl) {
              ogUrl = document.createElement('meta');
              ogUrl.setAttribute('property', 'og:url');
              document.head.appendChild(ogUrl);
            }
            ogUrl.setAttribute('content', fullUrl);

            // Update og:image with absolute URL for social crawlers requiring absolute scheme
            var ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage && ogImage.getAttribute('content').startsWith('/')) {
              var absoluteImg = origin + ogImage.getAttribute('content');
              ogImage.setAttribute('content', absoluteImg);
              var ogImageSecure = document.querySelector('meta[property="og:image:secure_url"]');
              if (ogImageSecure) ogImageSecure.setAttribute('content', absoluteImg);
              var twitterImage = document.querySelector('meta[name="twitter:image"]');
              if (twitterImage) twitterImage.setAttribute('content', absoluteImg);
            }
          }
        } catch(e) {}
      })();
    </script>
